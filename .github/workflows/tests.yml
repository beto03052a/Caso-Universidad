name: Campus Connect — Tests CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: PHP ${{ matrix.php }} — Laravel Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: campus_connect_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐘 Configurar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, pgsql, mbstring, openssl, tokenizer, xml, ctype, json, bcmath, fileinfo
          coverage: none

      - name: 📦 Caché de dependencias Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📥 Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: ⚙️ Configurar entorno de testing
        run: |
          cp .env.testing.ci .env
          php artisan key:generate

      - name: 🗃️ Ejecutar migraciones (SQLite in-memory para tests)
        run: php artisan migrate --force

      - name: 🧪 Ejecutar suite de pruebas PHPUnit
        run: php artisan test --stop-on-failure --testdox

      - name: 📊 Resumen de pruebas
        if: always()
        run: php artisan test --testdox 2>&1 || true
